<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KickStars Catálogo · Equipaciones LaLiga</title>
<style>
  :root{
    --pitch:#0d1210;
    --chalk:#f4f2ea;
    --chalk-dim:#c9c7bd;
    --gold:#d4a72c;
    --gold-dim:#8a7025;
    --card:#1a2420;
    --card-line:#2a3630;
    --pending:#232b27;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--pitch);
    color:var(--chalk);
    font-family:'Helvetica Neue', Arial, sans-serif;
    min-height:100vh;
  }
  .field-lines{
    position:fixed; inset:0; pointer-events:none; z-index:0;
    background-image:
      repeating-linear-gradient(90deg, transparent, transparent 119px, rgba(244,242,234,0.02) 120px);
    opacity:.6;
  }
  header{
    position:relative; z-index:1;
    padding:38px 32px 22px;
    border-bottom:1px solid var(--card-line);
  }
  .eyebrow{
    font-family: Georgia, 'Times New Roman', serif;
    font-style:italic;
    letter-spacing:.14em;
    text-transform:uppercase;
    font-size:11px;
    color:var(--gold);
    margin:0 0 10px;
  }
  .header-title-row{
    display:flex; align-items:center; justify-content:space-between;
    gap:16px; flex-wrap:wrap;
  }
  h1{
    margin:0;
    font-size:clamp(30px,5vw,52px);
    font-weight:800;
    letter-spacing:-0.02em;
    line-height:1.02;
  }
  h1 span{color:var(--gold);}
  .header-logo-link{
    position:relative; flex:none;
    display:inline-flex; align-items:center; justify-content:center;
    width:60px; height:60px;
    text-decoration:none;
    transition:transform .3s ease;
  }
  .header-logo-link:hover{transform:scale(1.08) rotate(-2deg);}
  .header-logo-link::before{
    content:"";
    position:absolute; inset:-10px;
    border-radius:50%;
    background:radial-gradient(circle, rgba(212,167,44,0.35), rgba(212,167,44,0) 72%);
    animation:logoGlow 2.6s ease-in-out infinite;
  }
  .header-logo-link img{
    position:relative; z-index:1;
    width:100%; height:100%; object-fit:contain;
    filter:drop-shadow(0 6px 14px rgba(0,0,0,.5));
  }
  .sub{
    max-width:640px;
    color:var(--chalk-dim);
    font-size:14.5px;
    line-height:1.55;
    margin-top:14px;
  }
  .search-wrap{
    margin-top:20px;
    max-width:420px;
    position:relative;
  }
  .search-wrap svg{
    position:absolute; left:14px; top:50%; transform:translateY(-50%);
    color:var(--gold-dim); pointer-events:none;
  }
  #searchInput{
    width:100%;
    background:var(--card);
    border:1px solid var(--card-line);
    color:var(--chalk);
    font-size:13.5px;
    padding:11px 14px 11px 38px;
    border-radius:8px;
    font-family:inherit;
    outline:none;
    transition:border-color .15s;
  }
  #searchInput::placeholder{color:var(--chalk-dim); opacity:.7;}
  #searchInput:focus{border-color:var(--gold-dim);}
  .search-count{
    font-size:11px; color:var(--gold-dim); margin-top:6px; min-height:14px;
  }

  .layout{
    position:relative; z-index:1;
    display:grid;
    grid-template-columns:260px 1fr;
    gap:0;
  }
  nav.teams{
    border-right:1px solid var(--card-line);
    padding:18px 10px 22px;
  }
  .league-group{margin-bottom:6px;}
  .league-head{
    display:flex; align-items:center; gap:8px;
    width:100%;
    background:none; border:none; cursor:pointer;
    color:var(--gold);
    font-size:10px; font-weight:700; letter-spacing:.06em; text-transform:uppercase;
    padding:12px 10px 8px;
    font-family:inherit;
  }
  .league-head .chev{
    flex:none;
    transition:transform .15s;
    font-size:9px;
    color:var(--gold-dim);
  }
  .league-head.collapsed .chev{transform:rotate(-90deg);}
  .league-head .league-name{
    flex:1; min-width:0;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .league-head .badge{
    margin-left:auto; font-size:9px; letter-spacing:.05em; text-transform:none;
    color:var(--chalk-dim); font-weight:400;
    border:1px solid var(--card-line); padding:1px 6px; border-radius:4px;
  }
  .league-body{overflow:hidden;}
  .league-body.collapsed{display:none;}

  .team-btn{
    display:flex; align-items:center; gap:10px;
    width:100%;
    background:none; border:none;
    color:var(--chalk-dim);
    font-size:14px;
    text-align:left;
    padding:9px 12px;
    border-radius:7px;
    cursor:pointer;
    transition:background .15s, color .15s;
    font-family:inherit;
  }
  .team-btn .num{
    font-size:10px;
    color:var(--gold-dim);
    width:20px;
    flex:none;
  }
  .team-btn:hover{background:rgba(212,167,44,0.08); color:var(--chalk);}
  .team-btn.active{background:rgba(212,167,44,0.14); color:var(--chalk); font-weight:600;}
  .team-btn.locked{opacity:.42; cursor:default;}
  .team-btn.locked:hover{background:none; color:var(--chalk-dim);}
  .team-btn.hidden{display:none;}
  .lock-tag{
    margin-left:auto; font-size:9.5px; letter-spacing:.06em;
    text-transform:uppercase; color:var(--gold-dim);
    border:1px solid var(--card-line); padding:2px 6px; border-radius:4px;
  }
  .no-match{
    padding:12px; font-size:12px; color:var(--chalk-dim); font-style:italic;
  }

  main{padding:28px 34px 80px;}
  .team-head{
    display:flex; align-items:baseline; gap:16px; margin-bottom:6px;
    flex-wrap:wrap;
  }
  .team-head h2{margin:0; font-size:26px; font-weight:800;}
  .team-head .count{color:var(--gold); font-size:13px; font-family:Georgia, serif; font-style:italic;}

  .view-toggle{
    display:flex; gap:0; margin:14px 0 4px; border:1px solid var(--card-line);
    border-radius:6px; overflow:hidden; width:fit-content;
  }
  .view-toggle button{
    background:var(--card); color:var(--chalk-dim); border:none; cursor:pointer;
    font-size:12px; font-weight:700; letter-spacing:.03em; padding:7px 16px;
    font-family:inherit; border-right:1px solid var(--card-line);
  }
  .view-toggle button:last-child{border-right:none;}
  .view-toggle button.active{background:var(--gold); color:#1a1a1a;}
  .view-toggle button:hover:not(.active){background:var(--card-line);}

  .season-block{margin-top:30px;}
  .season-tag{
    display:inline-flex; align-items:center; gap:8px;
    font-size:13px; font-weight:700; letter-spacing:.04em;
    background:var(--card); border:1px solid var(--card-line);
    padding:5px 12px; border-radius:5px;
    margin-bottom:14px;
  }
  .season-tag .yr-badge{
    background:var(--gold); color:#1a1a0a; font-size:10.5px; font-weight:800;
    padding:1px 6px; border-radius:3px;
  }
  .kit-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(168px,1fr));
    gap:14px;
  }
  .subgroup{margin-top:16px;}
  .subgroup:first-child{margin-top:10px;}
  .subgroup-tag{
    font-size:11px; font-weight:700; letter-spacing:.05em; text-transform:uppercase;
    color:var(--gold-dim);
    margin-bottom:10px;
    padding-left:2px;
  }
  .kit-card{
    background:var(--card);
    border:1px solid var(--card-line);
    border-radius:10px;
    overflow:hidden;
    display:flex; flex-direction:column;
    transition:transform .15s, border-color .15s;
  }
  .kit-card:hover{transform:translateY(-3px); border-color:var(--gold-dim);}
  .kit-photo{
    aspect-ratio:3/3.6;
    background:#0f1512;
    display:flex; align-items:center; justify-content:center;
    overflow:hidden;
  }
  .kit-photo img{width:100%; height:100%; object-fit:contain; padding:10px; background:#f4f2ea0d; cursor:zoom-in;}
  .kit-photo.has-back{position:relative;}
  .kit-photo.has-back img{position:absolute; inset:0; width:100%; height:100%; object-fit:contain; padding:10px; transition:opacity .25s ease;}
  .kit-photo.has-back img.front{opacity:1; z-index:2;}
  .kit-photo.has-back img.back{opacity:0; z-index:1;}
  .kit-photo.has-back:hover img.front{opacity:0;}
  .kit-photo.has-back:hover img.back{opacity:1;}
  .kit-label .flip-hint{font-size:9px; color:var(--gold-dim); margin-top:2px;}
  .lightbox{
    position:fixed; inset:0; background:rgba(6,9,7,0.92); z-index:50;
    display:none; align-items:center; justify-content:center; padding:40px; cursor:zoom-out;
  }
  .lightbox.open{display:flex;}
  .lightbox img{max-width:min(88vw,560px); max-height:86vh; object-fit:contain; border-radius:10px; box-shadow:0 20px 60px rgba(0,0,0,.5);}
  .lightbox .lb-cap{position:absolute; bottom:26px; left:0; right:0; text-align:center; color:var(--chalk-dim); font-size:13px;}
  .lightbox .lb-close{position:absolute; top:22px; right:28px; color:var(--gold); font-size:26px; cursor:pointer; line-height:1;}
  .kit-card.pending .kit-photo{background:var(--pending);}
  .kit-photo .placeholder-icon{color:var(--card-line); font-size:11px; text-align:center; padding:14px; line-height:1.5;}
  .kit-photo .placeholder-icon svg{opacity:.35; margin-bottom:6px;}
  .kit-label{
    padding:9px 11px 11px;
    border-top:1px solid var(--card-line);
  }
  .kit-label .name{font-size:12.5px; font-weight:700; line-height:1.3;}
  .kit-label .status{
    font-size:10px; margin-top:4px; letter-spacing:.03em;
    color:var(--gold-dim); text-transform:uppercase;
  }
  .kit-card.ready .kit-label .status{color:#7fae7a;}

  .legend{
    display:flex; gap:18px; margin:22px 0 4px;
    font-size:11.5px; color:var(--chalk-dim);
  }
  .legend span{display:inline-flex; align-items:center; gap:6px;}
  .dot{width:8px; height:8px; border-radius:50%; display:inline-block;}
  .dot.ready{background:#7fae7a;}
  .dot.pending{background:var(--gold-dim);}

  .empty-state{
    max-width:520px; padding:60px 0; color:var(--chalk-dim); font-size:14px; line-height:1.6;
  }
  .empty-state b{color:var(--gold);}

  ::-webkit-scrollbar{width:8px;}
  ::-webkit-scrollbar-thumb{background:var(--card-line); border-radius:4px;}

  /* ----------------------------------------------------------------
     Mobile dropdown toggle for the team menu (hidden on desktop)
  ---------------------------------------------------------------- */
  .nav-toggle{
    display:none;
    align-items:center; gap:9px;
    width:100%;
    margin-top:16px;
    background:var(--card);
    border:1px solid var(--card-line);
    color:var(--chalk);
    font-family:inherit;
    font-size:13.5px; font-weight:700; letter-spacing:.02em;
    padding:11px 14px;
    border-radius:8px;
    cursor:pointer;
  }
  .nav-toggle svg{color:var(--gold); flex:none;}
  .nav-toggle #navToggleLabel{flex:1; text-align:left;}
  .nav-toggle .chev{color:var(--gold-dim); font-size:11px; transition:transform .18s;}
  .nav-toggle.open .chev{transform:rotate(180deg);}
  .nav-toggle:active{background:var(--card-line);}

  .nav-backdrop{
    display:none;
    position:fixed; inset:0;
    background:rgba(6,9,7,0.6);
    z-index:39;
  }
  .nav-backdrop.show{display:block;}

  .mobile-nav-header{
    display:none;
    align-items:center; justify-content:space-between;
    position:fixed; top:0; left:0; right:0;
    height:54px;
    padding:0 10px 0 16px;
    background:var(--pitch);
    border-bottom:1px solid var(--card-line);
    z-index:43;
  }
  .mobile-nav-header span{
    font-weight:800; letter-spacing:.03em; text-transform:uppercase;
    font-size:13px; color:var(--gold);
  }
  .mobile-nav-header button{
    background:none; border:none; color:var(--chalk);
    font-size:28px; line-height:1; cursor:pointer;
    padding:6px 10px;
  }
  .mobile-nav-header.show{display:flex;}

  /* ----------------------------------------------------------------
     Mobile layout (<=880px): single column, full-screen dropdown
     team menu, tighter spacing, smaller type across the board.
  ---------------------------------------------------------------- */
  @media (max-width: 880px){
    header{padding:22px 18px 16px;}
    .sub{font-size:13.5px;}
    .search-wrap{max-width:100%;}
    .nav-toggle{display:flex;}

    .layout{grid-template-columns:1fr;}

    nav.teams{
      display:none;
      border-right:none;
      border-bottom:1px solid var(--card-line);
    }
    nav.teams.mobile-open{
      display:block;
      position:fixed;
      top:54px; left:0; right:0; bottom:0;
      z-index:42;
      max-height:none;
      height:calc(100vh - 54px);
      height:calc(100dvh - 54px);
      overflow-y:auto;
      background:var(--pitch);
      box-shadow:none;
      padding:14px 8px 40px;
      -webkit-overflow-scrolling:touch;
    }

    main{padding:20px 16px 60px;}
    .team-head{gap:10px;}
    .team-head h2{font-size:21px;}
    .view-toggle button{padding:7px 12px; font-size:11.5px;}
    .season-tag{font-size:12px; padding:5px 10px;}
    .kit-grid{
      grid-template-columns:repeat(auto-fill,minmax(126px,1fr));
      gap:10px;
    }
    .kit-label .name{font-size:11.5px;}
    .legend{gap:12px; flex-wrap:wrap; font-size:11px;}
    .lightbox{padding:16px;}
    .lightbox .lb-close{top:12px; right:16px; font-size:30px;}
    .empty-state{padding:36px 0;}
  }

  @media (max-width: 480px){
    h1{font-size:26px;}
    .eyebrow{font-size:10px;}
    .kit-grid{grid-template-columns:repeat(auto-fill,minmax(112px,1fr));}
  }

  /* ----------------------------------------------------------------
     WELCOME / LANDING SCREEN
  ---------------------------------------------------------------- */
  .welcome{
    max-width:980px;
    padding:6px 0 44px;
  }
  .welcome-badge{
    display:inline-flex; align-items:center; gap:8px;
    font-family:Georgia, 'Times New Roman', serif; font-style:italic;
    letter-spacing:.12em; text-transform:uppercase; font-size:11px;
    color:var(--gold);
    background:rgba(212,167,44,0.08);
    border:1px solid var(--gold-dim);
    padding:6px 14px; border-radius:999px;
    margin-bottom:16px;
  }

  /* --- Hero: logo + headline + big Instagram CTA --- */
  .welcome-hero{
    display:flex; align-items:center; gap:36px; flex-wrap:wrap;
    padding:4px 0 34px;
  }
  .welcome-logo-link{
    position:relative; flex:none;
    display:inline-flex; align-items:center; justify-content:center;
    width:190px; height:190px;
    text-decoration:none;
    transition:transform .3s ease;
  }
  .welcome-logo-link:hover{transform:scale(1.06) rotate(-2deg);}
  .welcome-logo-link::before{
    content:"";
    position:absolute; inset:-16px;
    border-radius:50%;
    background:radial-gradient(circle, rgba(212,167,44,0.38), rgba(212,167,44,0) 72%);
    animation:logoGlow 2.6s ease-in-out infinite;
  }
  @keyframes logoGlow{
    0%,100%{ opacity:.5; transform:scale(1); }
    50%{ opacity:1; transform:scale(1.1); }
  }
  .welcome-logo-link img{
    position:relative; z-index:1;
    width:100%; height:100%; object-fit:contain;
    filter:drop-shadow(0 10px 26px rgba(0,0,0,.55));
  }
  .welcome-hero-text{flex:1; min-width:280px;}
  .welcome-hero-text h2{
    margin:0 0 14px;
    font-size:clamp(26px,4vw,38px);
    font-weight:800;
    letter-spacing:-0.02em;
    line-height:1.12;
  }
  .welcome-hero-text h2 span{color:var(--gold);}
  .welcome-hero-text p.lead{
    max-width:560px;
    color:var(--chalk-dim);
    font-size:14.5px;
    line-height:1.65;
    margin:0 0 22px;
  }
  .welcome-cta-center{display:flex; justify-content:center; max-width:560px; margin-top:4px;}
  .welcome-ig-big{
    display:inline-flex; align-items:center; gap:12px;
    background:linear-gradient(120deg,#feda75,#d4a72c 22%,#c13584 58%,#833ab4 82%,#5851db);
    color:#20140a;
    text-decoration:none;
    font-size:14px; font-weight:800; letter-spacing:.01em;
    padding:12px 22px 12px 12px;
    border-radius:999px;
    box-shadow:0 6px 22px rgba(193,53,132,.32);
    animation:igPulse 2.4s ease-in-out infinite;
    transition:transform .15s;
  }
  .welcome-ig-big:hover{transform:translateY(-2px) scale(1.02);}
  @keyframes igPulse{
    0%,100%{ box-shadow:0 6px 20px rgba(193,53,132,.28); }
    50%{ box-shadow:0 8px 32px rgba(193,53,132,.55); }
  }
  .welcome-ig-big .ig-dot{
    width:30px; height:30px; border-radius:50%; flex:none;
    background:rgba(255,255,255,.9);
    display:flex; align-items:center; justify-content:center;
  }
  .welcome-ig-big .ig-dot svg{width:19px; height:19px;}

  /* --- Callout cards: encourage DMs for missing shirts / orders --- */
  .welcome-callouts{
    display:grid; grid-template-columns:repeat(auto-fit,minmax(270px,1fr));
    gap:16px; margin:0 0 38px;
  }
  .welcome-callout{
    background:var(--card); border:1px solid var(--card-line); border-radius:14px;
    padding:20px 20px 18px;
    position:relative; overflow:hidden;
    transition:border-color .15s, transform .15s;
  }
  .welcome-callout:hover{border-color:var(--gold-dim); transform:translateY(-2px);}
  .welcome-callout::before{
    content:""; position:absolute; top:-40%; right:-15%;
    width:150px; height:150px; border-radius:50%;
    background:radial-gradient(circle, rgba(212,167,44,.14), transparent 72%);
    pointer-events:none;
  }
  .welcome-callout .emoji{font-size:23px; margin-bottom:10px; display:block;}
  .welcome-callout h3{margin:0 0 8px; font-size:15px; font-weight:800; color:var(--chalk);}
  .welcome-callout p{margin:0 0 14px; font-size:13px; line-height:1.6; color:var(--chalk-dim);}
  .welcome-callout a{
    display:inline-flex; align-items:center; gap:6px;
    color:var(--gold); font-size:12.5px; font-weight:800;
    text-decoration:none; letter-spacing:.02em;
  }
  .welcome-callout a:hover{text-decoration:underline;}

  .welcome-section-title{
    font-size:11px; font-weight:800; letter-spacing:.09em; text-transform:uppercase;
    color:var(--gold-dim); margin:0 0 14px;
  }
  .welcome-steps{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
    gap:14px;
    margin-bottom:34px;
  }
  .welcome-step{
    background:var(--card);
    border:1px solid var(--card-line);
    border-radius:12px;
    padding:18px 18px 20px;
    transition:border-color .15s, transform .15s;
  }
  .welcome-step:hover{border-color:var(--gold-dim); transform:translateY(-2px);}
  .welcome-step .step-num{
    display:inline-flex; align-items:center; justify-content:center;
    width:26px; height:26px; border-radius:50%;
    background:var(--gold); color:#1a1a0a;
    font-size:12px; font-weight:800;
    margin-bottom:12px;
  }
  .welcome-step h3{
    margin:0 0 6px; font-size:14.5px; font-weight:700; color:var(--chalk);
  }
  .welcome-step p{
    margin:0; font-size:12.5px; line-height:1.55; color:var(--chalk-dim);
  }
  .welcome-modes{
    display:flex; flex-wrap:wrap; gap:8px;
    margin:0;
  }
  .welcome-modes span{
    font-size:11px; font-weight:700; letter-spacing:.03em;
    background:var(--card); border:1px solid var(--card-line);
    color:var(--chalk-dim);
    padding:6px 13px; border-radius:6px;
  }
  .welcome-modes span b{color:var(--gold); font-weight:800;}

  /* --- Top Ventas: tarjetas destacadas con foto real, arriba del todo --- */
  .welcome-topsales{ margin:0 0 36px; }
  .topsales-title{ display:flex; align-items:center; gap:6px; }
  .topsales-grid{
    display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr));
    gap:16px;
  }
  .topsales-card{
    background:var(--card); border:1px solid var(--card-line); border-radius:14px;
    overflow:hidden; cursor:pointer; text-align:left; padding:0;
    font-family:inherit; color:inherit; display:block; width:100%;
    transition:transform .18s, border-color .18s, box-shadow .18s;
  }
  .topsales-card:hover{
    transform:translateY(-4px);
    border-color:var(--gold);
    box-shadow:0 10px 26px rgba(212,167,44,.2);
  }
  .topsales-img-wrap{ position:relative; width:100%; aspect-ratio:1/1; background:#0d1210; overflow:hidden; }
  .topsales-img-wrap img{ width:100%; height:100%; object-fit:cover; display:block; transition:transform .3s; }
  .topsales-card:hover .topsales-img-wrap img{ transform:scale(1.07); }
  .topsales-tag{
    position:absolute; top:10px; left:10px;
    background:var(--gold); color:#1a1a0a;
    font-size:10.5px; font-weight:800; letter-spacing:.02em;
    padding:4px 10px; border-radius:999px;
    box-shadow:0 2px 8px rgba(0,0,0,.35);
  }
  .topsales-info{ padding:12px 14px 15px; }
  .topsales-name{ display:block; font-size:14.5px; font-weight:800; color:var(--chalk); margin-bottom:4px; }

const nav = document.getElementById('teamNav');

function shirtIcon(colors){
  const [c1,c2] = colors || ['#3a4a42','#2a3630'];
  return `<div class="placeholder-icon">${jerseySVG(c1,c2)}<div>Foto pendiente</div></div>`;
}

// Draws a simple two-tone jersey using the team's real colors. Renders instantly,
// with zero external dependency — used whenever a hotlinked photo isn't available or fails.
function jerseySVG(c1, c2){
  return `<svg width="70" height="70" viewBox="0 0 100 100">
    <path d="M30 8 L10 22 L18 38 L28 32 L28 90 L72 90 L72 32 L82 38 L90 22 L70 8 L60 16 L40 16 Z" fill="${c1}" stroke="rgba(0,0,0,.25)" stroke-width="1.5"/>
    <path d="M30 8 L10 22 L18 38 L28 32 Z M70 8 L90 22 L82 38 L72 32 Z" fill="${c2}"/>
    <path d="M40 16 Q50 24 60 16 L58 26 Q50 32 42 26 Z" fill="${c2}"/>
  </svg>`;
}

// Called when a hotlinked photo fails to load — swaps it for our own drawn jersey
// in the team's real colors, so there's always something meaningful to see.
function imgFallback(imgEl, c1, c2){
  const wrap = imgEl.closest('.kit-photo');
  if(!wrap) return;

}

// Removes accents/diacritics and lowercases, so "atlético" == "atletico".
function normalize(s){
  return (s||"").toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
}

let viewMode = 'actuales';
function isRealSeason(name){ return /^\d{4}-\d{2,4}$/.test(name); }
function seasonStartYear(name){ const m = name.match(/^(\d{4})-/); return m ? parseInt(m[1],10) : -1; }
// Chándales/sudaderas de entrenamiento (adulto), ropa de niños y camisetas de mujer se
// detectan por el nombre de la equipación, ya que conviven dentro del mismo bloque de
// temporada que las camisetas normales.
function isNinosKit(name){ return /kids|ni[nñ]os?|\bbaby\b/.test(normalize(name)); }
function isMujerKit(name){ return /mujer|women/.test(normalize(name)); }
function isChandalKit(name){
  const n = normalize(name);
  if(isNinosKit(name)) return false;
  return /chandal|halfzip|fullzip|entrenamiento|sudadera|anthem|windbreak/.test(n);
}
// Los kits de entrenamiento ("training") tienen su propia pestaña ("Entrenamiento"),
// separada de Actuales/Retro: no son la camiseta que se usa en partido.
function isTrainingKit(name){
  const n = normalize(name);
  if(isNinosKit(name) || isChandalKit(name)) return false;
  return /^training\b/.test(n);
}
// Cuentan como "oficial de esa temporada" (van en Actuales/Retro): 1ª/2ª/3ª/4ª equipación
// numerada, portero, las etiquetas antiguas "Local"/"Visitante", la versión jugador
// (Home/Away/Third/Goalkeeper, sin contar sus ediciones especiales) y manga larga —
// son la camiseta que se usa en partido, solo cambia el corte o la manga. El resto
// (entrenamiento, ediciones especiales, baseball, F1, jornada retro, pre-match,
// polos, shorts...) va a su propia pestaña o a Especiales.
function isOfficialKit(name){
  const n = normalize(name);
  if(/^\d+\s*[ºo°]?\.?\s*kit\b/.test(n)) return true;
  if(/^(local|visitante)$/.test(n)) return true;
  if(/^(\d+\s*[ºo°]?\.?\s*)?(portero|goalkeeper)(\s+\d{2,4}-\d{2,4})?$/.test(n)) return true;
  if(/^playerversion\s+(home|away|third|fourth|goalkeeper)\b/.test(n)) return true;
  if(/^manga larga\s+(home|away|third|fourth|goalkeeper)\b/.test(n)) return true;
  return false;
}
// Orden dentro de cada temporada: primero 1ª/2ª/3ª/4ª equipación, luego portero,
// y solo al final versión jugador y manga larga (todo lo demás mantiene su orden original).
function kitPriority(name){
  const n = normalize(name);
  const numMatch = n.match(/^(\d+)\s*[ºo°]?\.?\s*kit\b/);
  if(numMatch) return parseInt(numMatch[1],10);
  if(/^local$/.test(n)) return 1;
  if(/^visitante$/.test(n)) return 2;
  if(/^(\d+\s*[ºo°]?\.?\s*)?(portero|goalkeeper)\b/.test(n) && !/playerversion/.test(n)) return 10;
  if(/^playerversion/.test(n)) return 20;
  if(/^manga larga/.test(n)) return 30;
  if(/^training/.test(n)) return 40;
  return 5;
}
// Agrupa las versiones extra dentro de Especiales en secciones legibles.
function extraCategory(name){
  const n = normalize(name);
  if(/campeones/.test(n)) return 'Campeones 2026';
  if(/mascota/.test(n)) return 'Mascotas';
  if(/edicion/.test(n)) return 'Ediciones Especiales';
  if(/playerversion/.test(n)) return 'Versión Jugador';
  if(/baseball/.test(n)) return 'Baseball';
  if(/\bf1\b/.test(n)) return 'Fórmula 1';
  if(/jornada retro/.test(n)) return 'Jornada Retro';
  if(/pre.?match/.test(n)) return 'Pre-Match';
  if(/polo/.test(n)) return 'Polo';
  if(/short/.test(n)) return 'Shorts';
  return 'Otras Ediciones';
}
// Las 3 temporadas reales más recientes de un equipo (p.ej. 2025-26, 2024-25, 2023-24)
// se consideran "Actuales"; el resto de temporadas reales son "Retro".
// Sub-agrupa dentro de un mismo bloque de temporada (Actuales/Retro/Niños/Chándales/Mujer)
// cuando conviven varios tipos distintos de equipación, para que no aparezcan todas
// mezcladas en una sola rejilla sin distinción (p.ej. camiseta oficial + versión jugador
// + manga larga + entrenamiento del Mundial 26).
function kitSubgroup(name){
  const n = normalize(name);
  if(/^training\b/.test(n)) return 'Entrenamiento';
  if(/^manga larga/.test(n)) return 'Manga Larga';
  if(/^playerversion/.test(n)) return 'Versión Jugador';
  if(/halfzip/.test(n)) return 'Chándal Halfzip';
  if(/fullzip/.test(n)) return 'Chándal Fullzip';
  if(/anthem/.test(n)) return 'Anthem';
  if(/windbreak/.test(n)) return 'Windbreaker';
  if(/sudadera|entrenamiento/.test(n)) return 'Sudadera Entrenamiento';
  if(/\bbaby\b/.test(n)) return 'Baby';
  if(/^kids\b|ni[nñ]os?/.test(n)) return 'Niños';
  if(/\bcrop\b/.test(n)) return 'Women Crop';
  if(/\btop\b/.test(n)) return 'Women Top';
  if(/mujer|women/.test(n)) return 'Mujer';
  return 'Equipación Oficial';
}
function getRecentSeasons(team){
  // "Actuales" = temporadas realmente vigentes (24-25 en adelante), no simplemente
  // las 3 más nuevas QUE TENGA el equipo. Así, equipos con solo fotos históricas
  // (sin ninguna temporada reciente real) no muestran nada en Actuales, y todas
  // sus camisetas caen correctamente en Retro.
  const CURRENT_SEASON_CUTOFF = 2024;
  const real = [...new Set(team.data.filter(s=>isRealSeason(s.season)).map(s=>s.season))];
  return new Set(real.filter(s=> seasonStartYear(s) >= CURRENT_SEASON_CUTOFF));
}
function kitPassesMode(season, kit, mode, recentSeasons){
  const real = isRealSeason(season.season);
  const chandal = isChandalKit(kit.name);
  const ninos = isNinosKit(kit.name);
  const mujer = isMujerKit(kit.name);
  const training = isTrainingKit(kit.name);
  const official = isOfficialKit(kit.name);
  const soloCamiseta = !chandal && !ninos && !mujer && !training && official;
  if(mode==='actuales') return real && soloCamiseta && recentSeasons.has(season.season);
  if(mode==='retro') return real && soloCamiseta && !recentSeasons.has(season.season);
  if(mode==='especiales') return !chandal && !ninos && !mujer && !training && (!real || !official);
  if(mode==='chandales') return chandal;
  if(mode==='ninos') return ninos;
  if(mode==='mujer') return mujer;
  if(mode==='entrenamiento') return training;
  return true;
}

function renderTeam(team, filterText){
  main.innerHTML = "";
  if(!team.ready){
    main.innerHTML = `<div class="empty-state">
      <h2 style="color:var(--chalk); margin-bottom:10px;">${team.name}</h2>
      <p>Este equipo todavía no está cargado. La estructura <b>Liga → Equipo → Año → Equipación</b> ya está lista para recibirlo — dime "sigue con ${team.name}" y lo añadimos con el mismo formato que Real Madrid, FC Barcelona o Atlético Madrid.</p>
    </div>`;
    return;
  }
  const tokens = normalize(filterText).split(/\s+/).filter(Boolean);
  const teamNorm = normalize(team.name);
  const head = document.createElement('div');
  const totalKits = team.data.reduce((a,s)=>a+s.kits.length,0);
  const readyKits = team.data.reduce((a,s)=>a+s.kits.filter(k=>k.img).length,0);
  const recentSeasons = getRecentSeasons(team);
  const hasSpecials = team.data.some(s=>s.kits.some(k=>kitPassesMode(s,k,'especiales',recentSeasons)));
  const hasChandales = team.data.some(s=>s.kits.some(k=>isChandalKit(k.name)));
  const hasNinos = team.data.some(s=>s.kits.some(k=>isNinosKit(k.name)));
  const hasMujer = team.data.some(s=>s.kits.some(k=>isMujerKit(k.name)));
  const hasEntrenamiento = team.data.some(s=>s.kits.some(k=>isTrainingKit(k.name)));
  const availableModes = ['actuales','retro', ...(hasSpecials?['especiales']:[]), ...(hasEntrenamiento?['entrenamiento']:[]), ...(hasNinos?['ninos']:[]), ...(hasChandales?['chandales']:[]), ...(hasMujer?['mujer']:[])];
  if(!availableModes.includes(viewMode)) viewMode = 'actuales';
  const modeLabels = { actuales:'Actuales', retro:'Retro', especiales:'Especiales', entrenamiento:'Entrenamiento', ninos:'Niños', chandales:'Chándales', mujer:'Mujer' };
  head.innerHTML = `
    <div class="team-head"><h2>${team.name}</h2><span class="count">${team.data.length} temporadas · ${totalKits} equipaciones</span></div>
    <div class="legend">
      <span><span class="dot ready"></span>${readyKits} con foto real</span>
      <span><span class="dot pending"></span>${totalKits-readyKits} pendientes de foto</span>
    </div>
    <div class="view-toggle">
      ${availableModes.map(m=>`<button data-mode="${m}" class="${viewMode===m?'active':''}">${modeLabels[m]}</button>`).join('')}
    </div>`;
  main.appendChild(head);

  head.querySelectorAll('.view-toggle button').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      viewMode = btn.dataset.mode;
      renderTeam(team, searchInput.value);
    });
  });

  // Builds the <div class="kit-grid">...</div> markup for a list of kits.
  function buildKitGrid(kits){
    return kits.map(k=>{
      const ready = !!k.img;
      const resolve = (u)=> u.startsWith('http')||u.startsWith('data:')||u.startsWith('images/') ? u : REAL_IMG+u;
      const proxied = (u)=> (u.startsWith('data:')||!u.includes('footballkitarchive.com')) ? u : `https://wsrv.nl/?url=${encodeURIComponent(u)}&default=1`;
      const src = ready ? proxied(resolve(k.img)) : '';
      const hasBack = ready && !!k.imgBack;
      const src2 = hasBack ? proxied(resolve(k.imgBack)) : '';
      const c1 = (team.colors && team.colors[0]) || '#3a4a42';
      const c2 = (team.colors && team.colors[1]) || '#2a3630';
      const label = (team.name+' '+k.name).replace(/'/g,"");
      const onclick = ready ? `onclick="openLightbox('${src.replace(/'/g,"")}','${label}'${hasBack?`,'${src2.replace(/'/g,"")}'`:''})"` : '';
      const onerr = ready ? `onerror="imgFallback(this,'${c1}','${c2}')"` : '';
      const onerr2 = hasBack ? `onerror="this.style.display='none'"` : '';
      const photoInner = !ready ? shirtIcon(team.colors)
        : hasBack
          ? `<img class="front" src="${src}" alt="${k.name}" loading="lazy" referrerpolicy="no-referrer" ${onclick} ${onerr}><img class="back" src="${src2}" alt="${k.name} (espalda)" loading="lazy" referrerpolicy="no-referrer" ${onclick} ${onerr2}>`
          : `<img src="${src}" alt="${k.name}" loading="lazy" referrerpolicy="no-referrer" ${onclick} ${onerr}>`;
      return `<div class="kit-card ${ready?'ready':'pending'}">
        <div class="kit-photo${hasBack?' has-back':''}">${photoInner}</div>
        <div class="kit-label"><div class="name">${team.name} ${k.name}</div><div class="status">${ready?'Foto real':'Pendiente'}</div>${hasBack?'<div class="flip-hint">Pasa el ratón: espalda</div>':''}</div>
      </div>`;
    }).join('');
  }
  function matchesSearch(season, k){
    if(tokens.length===0) return true;
    const combined = teamNorm + " " + normalize(season.season) + " " + normalize(k.name);
    return tokens.every(t=>combined.includes(t));
  }

  let shown = 0;
  let anySection = false;

  if(viewMode==='especiales'){
    // Agrupamos todas las versiones extra/especiales en secciones (por temporada ficticia
    // ya existente, o por categoría detectada en el nombre: Baseball, Versión Jugador, etc.)
    const sections = new Map(); // sectionName -> kits[]
    team.data.forEach(season=>{
      season.kits.forEach(k=>{
        if(!kitPassesMode(season,k,'especiales',recentSeasons)) return;
        if(!matchesSearch(season,k)) return;
        const sectionName = isRealSeason(season.season) ? extraCategory(k.name) : season.season;
        if(!sections.has(sectionName)) sections.set(sectionName, []);
        sections.get(sectionName).push(k);
      });
    });
    sections.forEach((kits, sectionName)=>{
      shown += kits.length;
      anySection = true;
      const block = document.createElement('div');
      block.className = 'season-block';
      block.innerHTML = `<div class="season-tag"><span class="yr-badge">★</span> ${sectionName}</div>
        <div class="kit-grid">${buildKitGrid(kits)}</div>`;
      main.appendChild(block);
    });
  } else {
    const visibleData = team.data.filter(season=> season.kits.some(k=>kitPassesMode(season,k,viewMode,recentSeasons)));
    visibleData.forEach(season=>{
      const kits = season.kits.filter(k=> kitPassesMode(season,k,viewMode,recentSeasons) && matchesSearch(season,k));
      kits.sort((a,b)=> kitPriority(a.name)-kitPriority(b.name));
      if(kits.length===0) return;
      shown += kits.length;
      anySection = true;
      const block = document.createElement('div');
      block.className = 'season-block';
      const tag = isRealSeason(season.season) ? `<span class="yr-badge">${season.season}</span> Temporada ${season.season}` : `<span class="yr-badge">★</span> ${season.season}`;

      // Si dentro de la misma temporada conviven varios tipos de equipación
      // (p.ej. camiseta oficial + versión jugador + manga larga + entrenamiento),
      // las dividimos en subsecciones legibles en vez de una única rejilla mezclada.
      const groups = new Map();
      kits.forEach(k=>{
        const g = kitSubgroup(k.name);
        if(!groups.has(g)) groups.set(g, []);
        groups.get(g).push(k);
      });
      let bodyHtml;
      if(groups.size <= 1){
        bodyHtml = `<div class="kit-grid">${buildKitGrid(kits)}</div>`;
      } else {
        bodyHtml = [...groups.entries()].map(([g,gkits])=>
          `<div class="subgroup"><div class="subgroup-tag">${g}</div><div class="kit-grid">${buildKitGrid(gkits)}</div></div>`
        ).join('');
      }
      block.innerHTML = `<div class="season-tag">${tag}</div>${bodyHtml}`;
      main.appendChild(block);
    });
  }

  if(tokens.length>0 && shown===0){
    // Nota: se usa insertAdjacentHTML en vez de main.innerHTML += ... porque "+="
    // reserializa y reconstruye TODO el contenido de main desde cero, destruyendo
    // los botones de pestañas (Actuales/Retro/...) ya creados arriba y perdiendo
    // los listeners de click que tenían enganchados (dejaban de responder al clic).
    main.insertAdjacentHTML('beforeend', `<div class="empty-state"><p>Ningún resultado para "<b>${filterText}</b>" dentro de ${team.name}.</p></div>`);
  } else if(shown===0 && !anySection){
    const msgs = { actuales:'Sin temporadas actuales para mostrar.', retro:'Sin temporadas retro para mostrar.', especiales:'Sin ediciones especiales para mostrar.', chandales:'Sin chándales para mostrar.', ninos:'Sin ropa de niños para mostrar.', mujer:'Sin camisetas de mujer para mostrar.' };
    const msg = msgs[viewMode] || 'Nada para mostrar.';
    main.insertAdjacentHTML('beforeend', `<div class="empty-state"><p>${msg}</p></div>`);
  }
}

    el.addEventListener('click', ()=>{
      const item = topSales[parseInt(el.dataset.topsale,10)];
      const team = allTeams().find(t=>normalize(t.name)===normalize(item.teamName));
      if(team) goToTeam(team);
    });
  });
  main.querySelectorAll('.popular-team-chip').forEach(el=>{
    el.addEventListener('click', ()=>{
      const team = popularTeams[parseInt(el.dataset.popular,10)];
      if(team) goToTeam(team);
    });
  });
}

// Given the typed tokens, find which team (if any) is being referred to,
// so the search can "jump" to it (e.g. "atletico 23" -> Atlético Madrid).
// Solo se tienen en cuenta tokens de 3+ letras para decidir el salto (para que escribir
// una sola letra no salte de golpe a un equipo al azar mientras el usuario sigue escribiendo);
// tokens cortos o numéricos (temporadas) se ignoran aquí y se siguen usando para filtrar
// las equipaciones dentro del equipo ya seleccionado.
function findTeamMatch(tokens){
  const meaningful = tokens.filter(t=>t.length>=3);
  if(meaningful.length===0) return null;
  let best = null, bestScore = 0, bestLen = Infinity;
  allTeams().forEach(team=>{
    if(!team.ready) return;
    const words = normalize(team.name).split(/\s+/).filter(Boolean);
    const score = meaningful.filter(t=> words.some(w=>w.startsWith(t) || t.startsWith(w))).length;
    const nameLen = normalize(team.name).length;
    if(score > bestScore || (score>0 && score===bestScore && nameLen<bestLen)){
      bestScore = score; best = team; bestLen = nameLen;
    }
  });
  return bestScore>0 ? best : null;
}

function allTeams(){
  return leagues.flatMap(l=>l.teams||[]);
}

let currentTeam = null;

// Usado por las tarjetas de "Top Ventas" y "Equipos populares" en la pantalla de
// bienvenida para saltar directamente a la ficha de un equipo, igual que un click
// en el botón del equipo en el menú lateral.
function goToTeam(team){
  currentTeam = team;
  renderTeam(team, searchInput.value);
  if(typeof activateTeamButton === 'function') activateTeamButton(team);
  const label = document.getElementById('navToggleLabel');
  if(label) label.textContent = team.name;
  if(typeof closeMobileNav === 'function') closeMobileNav();
  window.scrollTo({top:0, behavior:'smooth'});
}

function buildSidebar(){
  nav.innerHTML = "";
  leagues.forEach(league=>{
    const group = document.createElement('div');
    group.className = 'league-group';

    const headBtn = document.createElement('button');
    headBtn.className = 'league-head' + (league.collapsed ? ' collapsed' : '');
    headBtn.innerHTML = `<span class="chev">▾</span><span class="league-name">${league.name}</span>${league.comingSoon ? '<span class="badge">Próx.</span>' : `<span class="badge">${league.teams.length}</span>`}`;
    const body = document.createElement('div');
    body.className = 'league-body' + (league.collapsed ? ' collapsed' : '');

    if(league.comingSoon){
      body.innerHTML = `<div class="no-match" style="padding:4px 12px 10px;">Próximamente</div>`;
    } else {
      // Orden alfabético dentro de la liga/selecciones, para que sea fácil de encontrar un equipo.
      const sortedTeams = [...league.teams].sort((a,b)=> normalize(a.name).localeCompare(normalize(b.name)));
      sortedTeams.forEach((team, i)=>{
        const btn = document.createElement('button');
        btn.className = 'team-btn' + (!team.ready?' locked':'');
        btn.dataset.name = normalize(team.name);
        btn.innerHTML = `<span class="num">${String(i+1).padStart(2,'0')}</span><span>${team.name}</span>${!team.ready?'<span class="lock-tag">Próx.</span>':''}`;
        btn.addEventListener('click', ()=>{
          document.querySelectorAll('.team-btn').forEach(b=>b.classList.remove('active'));
          btn.classList.add('active');
          currentTeam = team;
          renderTeam(team, searchInput.value);
          if(typeof closeMobileNav === 'function'){
            const label = document.getElementById('navToggleLabel');
            if(label) label.textContent = team.name;
            closeMobileNav();
          }
        });
        body.appendChild(btn);
      });
    }

    headBtn.addEventListener('click', ()=>{
      league.collapsed = !league.collapsed;
      headBtn.classList.toggle('collapsed', league.collapsed);
      body.classList.toggle('collapsed', league.collapsed);
    });

    group.appendChild(headBtn);
    group.appendChild(body);
    nav.appendChild(group);
  });

}

buildSidebar();
renderWelcome();

// Logo de la cabecera: vuelve a la pantalla de inicio (igual que recargar la página,
// pero sin perder el estado del buscador ni de los grupos de liga expandidos).
const headerLogoLink = document.getElementById('headerLogoLink');
if(headerLogoLink){
  headerLogoLink.addEventListener('click', (e)=>{
    e.preventDefault();
    currentTeam = null;
    searchInput.value = '';
    document.querySelectorAll('.team-btn').forEach(b=>b.classList.remove('active'));
    renderWelcome();
    window.scrollTo({top:0, behavior:'smooth'});
  });
}

// ---------------------------------------------------------------------
// MOBILE DROPDOWN MENU (hamburger toggle for the team sidebar)
// ---------------------------------------------------------------------
const navToggle = document.getElementById('navToggle');
const navBackdrop = document.getElementById('navBackdrop');
const mobileNavHeader = document.getElementById('mobileNavHeader');
const mobileNavClose = document.getElementById('mobileNavClose');

function openMobileNav(){
  nav.classList.add('mobile-open');
  navToggle.classList.add('open');
  navToggle.setAttribute('aria-expanded', 'true');
  navBackdrop.classList.add('show');
  mobileNavHeader.classList.add('show');
  document.body.style.overflow = 'hidden';
}

function closeMobileNav(){
  nav.classList.remove('mobile-open');
  navToggle.classList.remove('open');
  navToggle.setAttribute('aria-expanded', 'false');
  navBackdrop.classList.remove('show');
  mobileNavHeader.classList.remove('show');
  document.body.style.overflow = '';
}

if(navToggle){
  navToggle.addEventListener('click', ()=>{
    if(nav.classList.contains('mobile-open')) closeMobileNav();
    else openMobileNav();
  });
}
if(navBackdrop){
  navBackdrop.addEventListener('click', closeMobileNav);
}
if(mobileNavClose){
  mobileNavClose.addEventListener('click', closeMobileNav);
}
window.addEventListener('resize', ()=>{
  if(window.innerWidth > 880) closeMobileNav();
});

// ---------------------------------------------------------------------
// SEARCH
// ---------------------------------------------------------------------
function activateTeamButton(team){
  document.querySelectorAll('.team-btn').forEach(b=>b.classList.remove('active'));
  const btn = [...document.querySelectorAll('.team-btn')].find(b=>b.dataset.name===normalize(team.name));
  if(btn){
    btn.classList.add('active');
    // make sure its league group is expanded
    const group = btn.closest('.league-group');
    if(group){
      const body = group.querySelector('.league-body');
      const head = group.querySelector('.league-head');
      body.classList.remove('collapsed');
      head.classList.remove('collapsed');
    }
  }
}

searchInput.addEventListener('input', ()=>{
  const rawQ = searchInput.value;
  const tokens = normalize(rawQ).split(/\s+/).filter(Boolean);

  // If the query names a team (accent-insensitive), jump to it — e.g. "atletico 23" -> Atlético Madrid.
  const matchedTeam = findTeamMatch(tokens);
  if(matchedTeam && matchedTeam !== currentTeam){
    currentTeam = matchedTeam;
    activateTeamButton(matchedTeam);
  }

  // filter sidebar team list by name (accent-insensitive) — requiere que TODAS las
  // palabras escritas aparezcan en el nombre, así "real madrid" muestra solo ese equipo
  // en vez de todos los "real ..." y todos los "... madrid". Los números (temporada, p.ej.
  // "atletico 23") se ignoran para este filtro de nombre, ya que no forman parte del
  // nombre del equipo — solo se usan para filtrar equipaciones dentro del equipo.
  const nameTokens = tokens.filter(t=>!/^\d+$/.test(t));
  let visibleCount = 0;
  document.querySelectorAll('.team-btn').forEach(btn=>{
    const match = nameTokens.length===0 || nameTokens.every(t=>btn.dataset.name.includes(t));
    btn.classList.toggle('hidden', !match);
    if(match) visibleCount++;
  });
  // auto-expand league groups that have matches while searching
  document.querySelectorAll('.league-group').forEach(group=>{
    const body = group.querySelector('.league-body');
    const head = group.querySelector('.league-head');
    if(!body || body.querySelectorAll('.team-btn').length===0) return;
    const anyVisible = [...body.querySelectorAll('.team-btn')].some(b=>!b.classList.contains('hidden'));
    if(tokens.length>0){
      body.classList.toggle('collapsed', !anyVisible);
      head.classList.toggle('collapsed', !anyVisible);
    }
  });

  if(currentTeam){
    renderTeam(currentTeam, rawQ);
  }

  if(tokens.length===0){
    searchCount.textContent = "";
  } else {
    searchCount.textContent = `${visibleCount} equipo(s) coinciden en la barra lateral · resultados filtrados dentro de ${currentTeam ? currentTeam.name : ''}`;
  }
});
</script>
</body>
